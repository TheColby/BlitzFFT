[package]
name        = "blitzfft"
version     = "0.1.0"
edition     = "2021"
description = "Native Rust FFT for audio — SIMD CPU, CUDA, and Metal backends"
authors     = ["Colby Leider <colby@leider.org>"]

[[bin]]
name = "blitzfft"
path = "src/main.rs"

# ── Features ────────────────────────────────────────────────────────────────
[features]
default      = []
cuda         = ["dep:libloading"]
metal        = ["dep:metal", "dep:objc", "dep:cocoa-foundation"]
binary128    = []
fftw         = []
kissfft      = []
pocketfft    = []
foreign-fft  = ["fftw", "kissfft", "pocketfft"]
benchmark    = []

# ── Core dependencies ────────────────────────────────────────────────────────
[dependencies]
clap         = { version = "4",  features = ["derive"] }
hound        = "3"                              # WAV I/O
rustfft      = "6"                              # CPU fallback
realfft      = "3.5"                            # exact real-input FFTs
num-complex  = "0.4"
bytemuck     = { version = "1", features = ["derive"] }
anyhow       = "1"
thiserror    = "1"
rayon        = "1"                              # parallel audio chunking
once_cell    = "1"                              # lazy-init plan cache
indicatif    = "0.17"                           # progress bar
colored      = "2"

# ── Runtime CUDA (dlopen cuFFT) ───────────────────────────────────────────
libloading   = { version = "0.8", optional = true }

# ── Metal (macOS / Apple Silicon) ────────────────────────────────────────
metal             = { version = "0.27", optional = true }
objc              = { version = "0.2", optional = true }
cocoa-foundation  = { version = "0.1", optional = true }

[profile.release]
opt-level    = 3
lto          = "fat"
codegen-units = 1
panic        = "abort"
