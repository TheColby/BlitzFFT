[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "blitzfft"
dynamic = ["version"]
description = "Native Rust FFT analysis and benchmarking CLI for audio"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Colby Leider", email = "colby@leider.org" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.urls]
Homepage = "https://github.com/TheColby/BlitzFFT"
Repository = "https://github.com/TheColby/BlitzFFT"
Issues = "https://github.com/TheColby/BlitzFFT/issues"

[tool.maturin]
bindings = "bin"
