name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build default configuration
        run: cargo build --verbose

      - name: Test default configuration
        run: cargo test --verbose

      - name: Smoke test capability reporting
        run: |
          cargo run -- --list-backends
          cargo run -- --list-precisions
          cargo run -- --list-formats

  foreign-fft:
    name: stable / ubuntu / foreign-fft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install FFTW
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev

      - name: Build with foreign FFT comparisons
        run: cargo build --verbose --features foreign-fft

      - name: Test with foreign FFT comparisons
        run: cargo test --verbose --features foreign-fft
