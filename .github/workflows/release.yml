name: PyPI release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package without publishing
        required: false
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
      - name: Match release tag to Cargo version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Smoke test installed wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with tempfile.TemporaryDirectory() as directory:
              env = pathlib.Path(directory) / "venv"
              venv.create(env, with_pip=True)
              scripts = env / ("Scripts" if os.name == "nt" else "bin")
              python = scripts / ("python.exe" if os.name == "nt" else "python")
              binary = scripts / ("blitzfft.exe" if os.name == "nt" else "blitzfft")
              subprocess.run([str(python), "-m", "pip", "install", str(pathlib.Path(wheels[0]).resolve())], check=True)
              for option in ("--version", "--list-backends"):
                  subprocess.run([str(binary), option], cwd=directory, check=True)
          PY
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python3 -m pip install 'maturin>=1.8,<2'
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Smoke test source distribution
        run: |
          python3 -m venv /tmp/blitzfft-sdist-venv
          /tmp/blitzfft-sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/blitzfft-sdist-venv/bin/blitzfft --version
          /tmp/blitzfft-sdist-venv/bin/blitzfft --list-backends
      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  audit:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Check release artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 5 or len(sdists) != 1:
              raise SystemExit(f"expected 5 wheels and 1 sdist, found {len(wheels)} wheels and {len(sdists)} sdists")
          if len({path.name for path in wheels}) != len(wheels):
              raise SystemExit("duplicate wheel filenames")
          PY
          python3 -m pip install 'twine>=6,<7'
          python3 -m twine check dist/*

  publish:
    needs: audit
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
