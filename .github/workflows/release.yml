name: PyPI release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to Cargo version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: '2014'
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2014'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Smoke test installed wheel
        run: |
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', wheels[0]], check=True)"
          python -c "import shutil, subprocess; binary = shutil.which('blitzfft'); assert binary, 'blitzfft missing from PATH'; subprocess.run([binary, '--version'], check=True); subprocess.run([binary, '--list-backends'], check=True)"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python3 -m pip install 'maturin>=1.8,<2'
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
